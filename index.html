<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fano Biennale</title>
<link rel="preload" as="image" href="media/program-1.png">
<link rel="preload" as="image" href="media/program-2.png">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #000000;
  }

  #intro {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    box-sizing: border-box;
    padding: 14% 21%;
    overflow: hidden;
    cursor: pointer;
  }

  @media (max-width: 700px) {
    #intro {
      padding: 6%;
    }
  }

  #intro img {
    display: block;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  #program {
    background: #ffffff;
    cursor: pointer;
  }

  #program img {
    display: block;
    width: 100%;
    height: auto;
  }

  [hidden] {
    display: none !important;
  }
</style>
</head>
<body>
  <div id="intro">
    <img src="media/GIF2.gif" alt="Fanø Biennale 25 Sep – 25 Oct 2026">
  </div>

  <main id="program" hidden>
    <img src="media/program-1.png" alt="Fanø Biennale 2026 – Program, åbningsweekend">
    <img src="media/program-2.png" alt="Fanø Biennale 2026 – Programme, opening weekend">
  </main>

  <script>
    var intro = document.getElementById('intro');
    var program = document.getElementById('program');
    var timer = setTimeout(showProgram, 12000);

    function showProgram() {
      clearTimeout(timer);
      intro.hidden = true;
      program.hidden = false;
      window.scrollTo(0, 0);
    }

    function showIntro() {
      program.hidden = true;
      intro.hidden = false;
      window.scrollTo(0, 0);
    }

    intro.addEventListener('click', showProgram);
    program.addEventListener('click', showIntro);
  </script>
</body>
</html>
